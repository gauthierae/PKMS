[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkms-lint"
version = "0.3.2"
description = "Find broken links in a Markdown vault. Wikilinks and reference-style ID links."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "gauthierae" }]
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]
keywords = ["markdown", "wikilink", "obsidian", "vault", "linter", "pkm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/gauthierae/PKMS"

[project.scripts]
pkms-lint = "pkms_lint:app"

[tool.hatch.build.targets.wheel]
include = ["pkms_lint.py"]
